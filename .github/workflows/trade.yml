name: Run Alpaca ML Trading Bot

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, and 18:00 UTC)
    - cron: '0 */6 * * *'
  # Adds a manual "Run workflow" button in the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-py scikit-learn pandas numpy joblib python-dotenv

      - name: Execute paca.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
        run: python paca.py
